<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body {
    width: 268px; margin: 0; padding: 16px;
    font-family: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px; background: #14151a; color: #f3f4f7;
    -webkit-font-smoothing: antialiased;
  }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .logo { width: 26px; height: 26px; border-radius: 8px; }
  .name { font-weight: 650; font-size: 16px; letter-spacing: -0.01em; }

  .switch { position: relative; width: 44px; height: 26px; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: rgba(255,255,255,.16); border-radius: 999px; transition: .18s; }
  .slider::before { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .18s; }
  .switch input:checked + .slider { background: #5b6cf0; }
  .switch input:checked + .slider::before { transform: translateX(18px); }

  .stat { display: flex; gap: 10px; }
  .box { flex: 1; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px 12px; text-align: center; }
  .box .num { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .box.total .num { color: #5b6cf0; }
  .box .lbl { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 3px; }
  .status { text-align: center; font-size: 11.5px; color: rgba(255,255,255,.45); margin-top: 14px; }
  .status b { color: #f3f4f7; font-weight: 500; }
</style>
</head>
<body>
  <div class="head">
    <div class="brand"><img class="logo" src="icons/icon48.png" alt="" /><span class="name">NoAds</span></div>
    <label class="switch"><input type="checkbox" id="power" checked /><span class="slider"></span></label>
  </div>
  <div class="stat">
    <div class="box"><div class="num" id="current">0</div><div class="lbl">this page</div></div>
    <div class="box total"><div class="num" id="total">0</div><div class="lbl">all-time</div></div>
  </div>
  <div class="status" id="status"><b>Blocking is on</b></div>
  <script src="popup.js"></script>
</body>
</html>
