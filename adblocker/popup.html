<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body {
    width: 260px; margin: 0; padding: 18px 16px;
    font-family: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #16161a; color: #f3f3f5;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .logo { width: 24px; height: 24px; border-radius: 7px; }
  .name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .sub { color: rgba(255,255,255,.5); font-size: 11.5px; margin-bottom: 16px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; }
  .dot.off { background: #9a9aa2; }
  button {
    width: 100%; padding: 11px; border: none; border-radius: 10px; cursor: pointer;
    font-size: 13px; font-weight: 550; font-family: inherit;
    background: #5b6cf0; color: #fff;
  }
  button.paused { background: rgba(255,255,255,.08); color: #f3f3f5; border: 1px solid rgba(255,255,255,.15); }
  button:hover { opacity: .9; }
  .note { color: rgba(255,255,255,.4); font-size: 10.5px; margin-top: 12px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="brand">
    <img class="logo" src="icons/icon48.png" alt="" />
    <span class="name">NoAds</span>
  </div>
  <div class="sub">Ads, trackers & YouTube ads blocked.</div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Blocking is on</span></div>
  <button id="toggle">Pause on this browser</button>
  <div class="note">The number on the toolbar icon is how many requests were blocked on the current tab.</div>
  <script src="popup.js"></script>
</body>
</html>
