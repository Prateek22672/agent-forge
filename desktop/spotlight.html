<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>AgentFury Quick Find</title>
<style>
  :root {
    --bg: rgba(18, 19, 24, .985);
    --fg: #f4f5f9;
    --muted: #8f95a6;
    --dim: #5f6478;
    --accent: #8b9bff;
    --accent-soft: rgba(110, 128, 255, .18);
    --rule: rgba(255, 255, 255, .07);
    --chip: rgba(255, 255, 255, .05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body {
    font-family: "Segoe UI", -apple-system, system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 14px;
    overflow: hidden;
  }
  button { font-family: inherit; }

  /* ---- search bar ---- */
  .bar { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 56px; flex: none; }
  .logo { width: 22px; height: 22px; border-radius: 6px; background: #fff; color: #000;
          display: grid; place-items: center; font-size: 10px; font-weight: 800; letter-spacing: -.04em; flex: none; }
  #q { flex: 1; background: none; border: 0; outline: none; color: var(--fg);
       font-size: 16.5px; font-family: inherit; padding: 0; min-width: 0; }
  #q::placeholder { color: var(--dim); }
  .count { font-size: 11px; color: var(--dim); flex: none; font-variant-numeric: tabular-nums; }

  /* ---- filter chips ---- */
  .chips { display: flex; gap: 6px; padding: 0 14px 10px; flex: none; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    border: 0; background: var(--chip); color: var(--muted);
    font-size: 11.5px; padding: 4.5px 11px; border-radius: 999px; cursor: default;
    white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  .chip .n { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .chip.on { background: var(--accent-soft); color: var(--accent); }
  .chip.on .n { color: var(--accent); opacity: .8; }
  .chip.zero { opacity: .34; }

  /* ---- results ---- */
  #list { flex: 1; overflow-y: auto; padding: 0 6px 6px; }
  #list::-webkit-scrollbar { width: 9px; }
  #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 5px;
    border: 3px solid transparent; background-clip: content-box; }

  .sect { font-size: 10px; text-transform: uppercase; letter-spacing: .12em;
          color: var(--dim); padding: 8px 12px 5px; }

  .row { display: flex; align-items: center; gap: 12px; padding: 8px 12px;
         border-radius: 9px; cursor: default; scroll-margin: 10px; }
  .row.on { background: var(--accent-soft); }
  .ico { width: 31px; height: 31px; border-radius: 8px; display: grid; place-items: center;
         font-size: 14px; flex: none; background: rgba(255,255,255,.06); }
  .txt { min-width: 0; flex: 1; }
  .nm { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pt { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; direction: rtl; text-align: left; margin-top: 1px; }
  .meta { font-size: 11px; color: var(--dim); flex: none; text-align: right; line-height: 1.5;
          font-variant-numeric: tabular-nums; }

  .empty { padding: 30px 22px; text-align: center; color: var(--muted); font-size: 13.5px; line-height: 1.65; }
  .empty b { color: var(--fg); font-weight: 600; }
  .empty .hint { display: block; margin-top: 8px; font-size: 12px; color: var(--dim); }

  .ask .ico { background: rgba(139,155,255,.17); }
  .ask .nm { color: var(--accent); }

  /* ---- answer panel ---- */
  .answer { margin: 4px 8px 10px; padding: 14px 16px; border-radius: 11px;
            background: rgba(255,255,255,.04); border: 1px solid var(--rule); }
  .answer h4 { margin: 0 0 7px; font-size: 11px; text-transform: uppercase;
               letter-spacing: .12em; color: var(--accent); font-weight: 600; }
  .answer p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--fg); white-space: pre-wrap; }
  .answer .src { margin-top: 9px; font-size: 11px; color: var(--dim); }

  /* ---- footer / actions ---- */
  .foot { flex: none; display: flex; align-items: center; gap: 13px; padding: 8px 14px;
          border-top: 1px solid var(--rule); font-size: 11px; color: var(--dim); }
  .foot .sp { margin-left: auto; }
  .act { display: flex; align-items: center; gap: 4px; }
  kbd { font-family: inherit; font-size: 10px; background: rgba(255,255,255,.08);
        border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px;
        padding: 1.5px 5px; color: var(--muted); }

  /* ---- toast ---- */
  #toast { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%) translateY(8px);
           background: rgba(255,255,255,.95); color: #111; font-size: 12px; font-weight: 600;
           padding: 7px 14px; border-radius: 999px; opacity: 0; transition: opacity .16s, transform .16s;
           pointer-events: none; }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="bar">
    <div class="logo">AF</div>
    <input id="q" type="text" placeholder="Search files, downloads — or ask anything"
           autocomplete="off" spellcheck="false" />
    <span class="count" id="count"></span>
  </div>

  <div class="chips" id="chips"></div>
  <div id="list"></div>

  <div class="foot" id="foot">
    <span class="act"><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span class="act"><kbd>↵</kbd> open</span>
    <span class="act"><kbd>Ctrl</kbd><kbd>↵</kbd> folder</span>
    <span class="act"><kbd>Ctrl</kbd><kbd>C</kbd> copy</span>
    <span class="act sp"><kbd>Tab</kbd> filter</span>
    <span class="act"><kbd>Esc</kbd> close</span>
  </div>

  <div id="toast"></div>

<script>
const api = window.spotlight;
const $q = document.getElementById("q");
const $list = document.getElementById("list");
const $count = document.getElementById("count");
const $chips = document.getElementById("chips");
const $toast = document.getElementById("toast");

const FILTERS = [
  ["all", "All"], ["image", "Images"], ["pdf", "PDFs"], ["doc", "Docs"],
  ["sheet", "Sheets"], ["media", "Media"], ["code", "Code"], ["folder", "Folders"],
];

let rows = [];
let sel = 0;
let group = "all";
let seq = 0;
let lastCounts = {};

const KIND_ICON = {
  image: "🖼", pdf: "📕", doc: "📄", sheet: "📊", slide: "📽",
  video: "🎬", audio: "🎵", code: "⌨", data: "🔧", archive: "🗜",
  app: "⚙", folder: "📁", other: "📄",
};

const fmtSize = (b) => {
  if (!b) return "";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (b < 10 && i > 0 ? b.toFixed(1) : Math.round(b)) + " " + u[i];
};

const fmtWhen = (ms) => {
  if (!ms) return "";
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  const d = Math.round(s / 86400);
  if (d < 30) return d + "d ago";
  return new Date(ms).toLocaleDateString();
};

const esc = (s) => String(s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let toastTimer = 0;
function toast(msg) {
  $toast.textContent = msg;
  $toast.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove("on"), 1600);
}

function renderChips() {
  $chips.innerHTML = "";
  FILTERS.forEach(([key, label]) => {
    const n = lastCounts[key];
    const b = document.createElement("button");
    b.className = "chip" + (group === key ? " on" : "") + (n === 0 ? " zero" : "");
    b.innerHTML = esc(label) + (n ? '<span class="n">' + n + "</span>" : "");
    b.addEventListener("click", () => { group = key; run(); });
    $chips.appendChild(b);
  });
}

function render(items, query) {
  rows = items.map((item) => ({ kind: "file", item }));
  const q = query.trim();
  if (q) rows.push({ kind: "ask", q });

  sel = 0;
  $count.textContent = items.length ? items.length : "";
  $list.innerHTML = "";
  renderChips();

  if (!rows.length) {
    $list.innerHTML =
      '<div class="empty"><b>Nothing here matches that.</b>' +
      '<span class="hint">Try a different filter above, or press <kbd>↵</kbd> to ask instead.</span></div>';
    return;
  }

  const head = document.createElement("div");
  head.className = "sect";
  head.textContent = q ? "On this laptop" : "Recent files & downloads";
  $list.appendChild(head);

  rows.forEach((r, i) => {
    const el = document.createElement("div");
    el.className = "row" + (r.kind === "ask" ? " ask" : "");
    el.dataset.i = i;
    if (r.kind === "ask") {
      el.innerHTML =
        '<div class="ico">✦</div><div class="txt"><div class="nm">Ask about “' +
        esc(r.q) + '”</div><div class="pt">Answered here, without leaving this window</div></div>';
    } else {
      const it = r.item;
      el.innerHTML =
        '<div class="ico">' + (KIND_ICON[it.kind] || "📄") + "</div>" +
        '<div class="txt"><div class="nm">' + esc(it.name) + "</div>" +
        '<div class="pt">' + esc(it.dir) + "</div></div>" +
        '<div class="meta">' + fmtWhen(it.mtime) +
        (it.isDir ? "" : "<br>" + fmtSize(it.size)) + "</div>";
    }
    el.addEventListener("mousemove", () => setSel(i));
    el.addEventListener("click", () => activate(i));
    $list.appendChild(el);
  });
  paint();
}

function paint() {
  [...$list.querySelectorAll(".row")].forEach((el) => {
    const on = +el.dataset.i === sel;
    el.classList.toggle("on", on);
    if (on) el.scrollIntoView({ block: "nearest" });
  });
}

function setSel(i) {
  if (i === sel || i < 0 || i >= rows.length) return;
  sel = i;
  paint();
}

const current = () => rows[sel];

async function activate(i) {
  const r = rows[i ?? sel];
  if (!r) return;
  if (r.kind === "ask") return askInline(r.q);
  api.open(r.item.path);
}

// Answering happens HERE — the popup never punts the user to the big window.
async function askInline(q) {
  const box = document.createElement("div");
  box.className = "answer";
  box.innerHTML = '<h4>AgentFury</h4><p>Thinking…</p>';
  $list.prepend(box);
  const res = await api.ask(q);
  if (res && res.ok) {
    box.innerHTML = "<h4>AgentFury</h4><p>" + esc(res.text) + "</p>";
  } else {
    box.innerHTML =
      "<h4>AgentFury</h4><p>" +
      esc((res && res.error) || "Couldn't answer that right now.") +
      "</p>";
  }
}

let timer = 0;
$q.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(run, 45);
});

async function run() {
  const query = $q.value;
  const mine = ++seq;
  const res = await api.search(query, group);
  if (mine !== seq) return; // a newer keystroke already won
  lastCounts = (res && res.counts) || {};
  render((res && res.items) || [], query);
}

function cycleFilter(dir) {
  const i = FILTERS.findIndex(([k]) => k === group);
  group = FILTERS[(i + dir + FILTERS.length) % FILTERS.length][0];
  run();
}

document.addEventListener("keydown", async (e) => {
  const r = current();
  const file = r && r.kind === "file" ? r.item : null;

  if (e.key === "Escape") { e.preventDefault(); api.hide(); return; }
  if (e.key === "Tab") { e.preventDefault(); cycleFilter(e.shiftKey ? -1 : 1); return; }
  if (e.key === "ArrowDown") { e.preventDefault(); setSel(Math.min(sel + 1, rows.length - 1)); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); setSel(Math.max(sel - 1, 0)); return; }

  if (e.key === "Enter") {
    e.preventDefault();
    if (file && (e.ctrlKey || e.metaKey)) api.reveal(file.path);
    else activate();
    return;
  }
  if (!file) return;

  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "c") {
    e.preventDefault();
    const how = await api.copy(file.path, e.shiftKey ? "path" : "file");
    toast(how === "file" ? "File copied" : "Path copied");
    return;
  }
  if ((e.ctrlKey || e.metaKey) && k === "s") {
    e.preventDefault();
    const how = await api.share(file.path);
    toast(how === "sheet" ? "Sharing…" : "File path copied to share");
    return;
  }
  if (e.key === "Delete") {
    e.preventDefault();
    if (await api.trash(file.path)) { toast("Moved to recycle bin"); run(); }
    else toast("Couldn't move that file");
    return;
  }
});

api.onShow(() => {
  $q.value = "";
  group = "all";
  $q.focus();
  $q.select();
  run();
});

run();
$q.focus();
</script>
</body>
</html>
