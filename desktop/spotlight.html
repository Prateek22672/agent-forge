<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>AgentFury Quick Find</title>
<style>
  /* ------------------------------------------------------------------ *
   * Quick Find
   *
   * A launcher is read in glances, so the design does three things:
   * gives the query line real presence, lets the selected row carry the
   * weight instead of every row competing, and keeps exactly one hue.
   * Every other distinction is weight, size or opacity — which is what
   * lets a dense list stay calm at a glance.
   *
   * One SOLID accent, no gradient ramps: a gradient reads as decoration
   * and shifts hue across a surface, so it can't be used to mean
   * "selected" consistently. A single colour at varying strength can.
   * ------------------------------------------------------------------ */
  :root {
    --bg-0: #0a0b0f;      /* deepest — the window ground */
    --bg-1: #101219;      /* raised — preview pane */
    --bg-2: #171a23;      /* inset  — wells inside panels */
    --fg:   #f4f5f9;
    --muted:#959bad;
    --dim:  #5f657a;
    --accent:      #7c8cff;
    --accent-ink:  #0a0b0f;   /* text ON the accent */
    --accent-wash: rgba(124,140,255,.13);
    --accent-line: rgba(124,140,255,.45);
    --rule: rgba(255,255,255,.06);
    --chip: rgba(255,255,255,.04);
    --r-lg: 20px;
    --r-md: 13px;
    --r-sm: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, system-ui, sans-serif;
    color: var(--fg); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    background: var(--bg-0);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: var(--r-lg);
    overflow: hidden;
    box-shadow: 0 28px 80px -20px rgba(0,0,0,.75);
    animation: pop .17s cubic-bezier(.2,.9,.3,1);
  }
  /* NOTHING animates opacity. This window is created hidden and shown on the
     hotkey, and an animation started while hidden never advances — it holds its
     first frame. A keyframe starting at opacity 0 therefore leaves content
     PERMANENTLY invisible; that bug hid the entire results list once already.
     Transform-only keyframes cannot fail that way. */
  @keyframes pop { from { transform: scale(.988) translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  button { font-family: inherit; cursor: default; border: 0; background: none; color: inherit; }

  /* ---- query line — the anchor of the whole window ---- */
  .bar { display: flex; align-items: center; gap: 14px; padding: 0 20px; height: 66px; flex: none; }
  .logo {
    width: 27px; height: 27px; border-radius: 9px; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-size: 10.5px; font-weight: 800; letter-spacing: -.04em;
  }
  #q {
    flex: 1; background: none; border: 0; outline: none; color: var(--fg);
    font-size: 19px; font-weight: 400; letter-spacing: -.011em; padding: 0; min-width: 0;
    font-family: inherit;
  }
  #q::placeholder { color: var(--dim); }
  .count {
    font-size: 11px; color: var(--dim); flex: none; font-variant-numeric: tabular-nums;
    background: var(--chip); padding: 4px 9px; border-radius: 99px;
  }
  .count:empty { display: none; }

  /* ---- filters ---- */
  .chips { display: flex; gap: 6px; padding: 0 17px 12px; flex: none; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    border: 1px solid transparent; background: var(--chip); color: var(--muted);
    font-size: 11.5px; padding: 5.5px 13px; border-radius: 99px; white-space: nowrap;
    display: flex; align-items: center; gap: 7px; transition: color .13s, background .13s, border-color .13s;
  }
  .chip:hover { color: var(--fg); background: rgba(255,255,255,.075); }
  .chip .n { font-size: 10px; opacity: .6; font-variant-numeric: tabular-nums; }
  .chip.on { background: var(--accent-wash); color: var(--accent); border-color: var(--accent-line); }
  .chip.on .n { opacity: .85; }
  .chip.zero { opacity: .28; }

  /* ---- body ---- */
  .body { flex: 1; display: flex; min-height: 0; }
  #list { flex: 1; overflow-y: auto; padding: 0 9px 10px; min-width: 0; }
  #list::-webkit-scrollbar { width: 11px; }
  #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 6px;
    border: 3.5px solid transparent; background-clip: content-box; }
  #list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.18); background-clip: content-box; }

  .sect {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: .16em;
    color: var(--dim); padding: 13px 13px 7px; font-weight: 700;
  }

  /* Only the SELECTED row is a surface. Giving every row a border or fill
     turns the list into stripes and hides which one Enter will act on. */
  .row {
    display: flex; align-items: center; gap: 13px; padding: 10px 13px;
    border-radius: var(--r-md); scroll-margin: 12px; position: relative;
    border: 1px solid transparent;
  }
  .row:hover { background: rgba(255,255,255,.035); }
  .row.on {
    background: var(--accent-wash);
    border-color: var(--accent-line);
  }
  #list.enter { animation: slide .2s cubic-bezier(.2,.9,.3,1); }
  @keyframes slide { from { transform: translateY(6px); } }

  .ico {
    width: 34px; height: 34px; border-radius: var(--r-sm); display: grid; place-items: center;
    font-size: 15px; flex: none; background: rgba(255,255,255,.05);
    transition: background .13s;
  }
  .row.on .ico { background: rgba(124,140,255,.22); }
  .txt { min-width: 0; flex: 1; }
  .nm { font-size: 14px; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.on .nm { font-weight: 600; }
  .pt { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; direction: rtl; text-align: left; margin-top: 2px; }
  .meta { font-size: 10.5px; color: var(--dim); flex: none; text-align: right; line-height: 1.6;
          font-variant-numeric: tabular-nums; }
  .snip { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 4px;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .snip mark { background: rgba(124,140,255,.3); color: var(--fg); border-radius: 3px; padding: 0 3px; }
  .inside .ico { background: rgba(124,140,255,.16); }
  .ask .ico { background: var(--accent); color: var(--accent-ink); }
  .ask .nm { color: var(--accent); font-weight: 600; }

  /* ---- preview ---- */
  .prev {
    width: 250px; flex: none; border-left: 1px solid var(--rule); padding: 16px;
    display: flex; flex-direction: column; gap: 11px; overflow: hidden; background: var(--bg-1);
  }
  .prev.empty { display: none; }
  .prev .shot { border-radius: var(--r-md); overflow: hidden; background: var(--bg-2);
                display: grid; place-items: center; max-height: 158px; }
  .prev .shot img { max-width: 100%; max-height: 158px; display: block; object-fit: contain; }
  .prev .body-text {
    font-size: 11px; line-height: 1.6; color: var(--muted);
    background: var(--bg-2); border-radius: var(--r-md); padding: 12px 13px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical;
  }
  .prev .pname { font-size: 12.5px; font-weight: 600; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .prev .pmeta { font-size: 10.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .prev .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: auto; }
  .prev .acts button {
    border: 1px solid var(--rule); background: var(--chip); color: var(--muted);
    font-size: 11.5px; padding: 8px 6px; border-radius: var(--r-sm);
    transition: color .13s, background .13s, border-color .13s;
  }
  .prev .acts button:hover { color: var(--fg); border-color: var(--accent-line); background: var(--accent-wash); }
  .prev .acts .wide {
    grid-column: 1 / -1; background: var(--accent); color: var(--accent-ink);
    font-weight: 700; border-color: transparent;
  }
  .prev .acts .wide:hover { background: #8f9dff; color: var(--accent-ink); }

  /* ---- answer ---- */
  .answer {
    margin: 9px; padding: 16px 18px; border-radius: 16px;
    background: var(--accent-wash); border: 1px solid var(--accent-line);
  }
  .answer h4 { margin: 0 0 9px; font-size: 10px; text-transform: uppercase; letter-spacing: .17em;
               color: var(--accent); font-weight: 700; }
  .answer p { margin: 0; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; }
  .answer .src { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
                 font-size: 10.5px; color: var(--dim); }
  .srcpill { background: rgba(255,255,255,.07); border-radius: 99px; padding: 3.5px 11px; color: var(--muted); }
  .dots span { display: inline-block; width: 5px; height: 5px; margin-right: 4px; border-radius: 50%;
    background: var(--accent); animation: blink 1s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s } .dots span:nth-child(3) { animation-delay: .3s }
  @keyframes blink { 50% { opacity: .25 } }

  /* ---- action plan ---- */
  .plan { margin: 9px; padding: 17px 19px; border-radius: 16px;
    background: var(--accent-wash); border: 1px solid var(--accent-line); }
  .plan h4 { margin: 0 0 5px; font-size: 10px; text-transform: uppercase; letter-spacing: .17em;
             color: var(--accent); font-weight: 700; }
  .plan .title { font-size: 15px; font-weight: 600; margin-bottom: 4px; letter-spacing: -.01em; }
  .plan .where { font-size: 11.5px; color: var(--muted); font-family: inherit; }
  .plan .files { margin: 13px 0 0; padding: 11px 13px; border-radius: var(--r-md);
                 background: rgba(0,0,0,.32); font-size: 11.5px; color: var(--muted);
                 line-height: 1.75; max-height: 96px; overflow: hidden; }
  .plan .btns { display: flex; gap: 9px; margin-top: 15px; align-items: center; }
  .plan button { border-radius: var(--r-sm); padding: 9px 17px; font-size: 12.5px; font-weight: 600; }
  .plan .go { background: var(--accent); color: var(--accent-ink); }
  .plan .go:hover { background: #8f9dff; }
  .plan .no { background: var(--chip); color: var(--muted); border: 1px solid var(--rule); }
  .plan .no:hover { color: var(--fg); }
  .plan .safe { margin-left: auto; font-size: 10.5px; color: var(--dim); }

  /* ---- consent ---- */
  .consent { margin: 9px; padding: 18px 20px; border-radius: 16px;
    background: var(--accent-wash); border: 1px solid var(--accent-line); }
  .consent h4 { margin: 0 0 8px; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .consent p { margin: 0 0 14px; font-size: 12.5px; line-height: 1.7; color: var(--muted); }
  .consent .btns { display: flex; gap: 9px; }
  .consent button { border-radius: var(--r-sm); padding: 9px 16px; font-size: 12.5px; font-weight: 600; }
  .cprimary { background: var(--accent); color: var(--accent-ink); }
  .cprimary:hover { background: #8f9dff; }
  .cghost { background: var(--chip); color: var(--muted); border: 1px solid var(--rule); }
  .cghost:hover { color: var(--fg); }

  .empty { padding: 38px 24px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.75; }
  .empty b { color: var(--fg); font-weight: 600; }
  .empty .hint { display: block; margin-top: 9px; font-size: 12.5px; color: var(--dim); }

  /* ---- footer ---- */
  .foot { flex: none; display: flex; align-items: center; gap: 16px; padding: 10px 17px;
          border-top: 1px solid var(--rule); font-size: 10.5px; color: var(--dim); }
  .foot .sp { margin-left: auto; }
  .act { display: flex; align-items: center; gap: 5px; }
  kbd { font-size: 9.5px; background: rgba(255,255,255,.06); border: 1px solid var(--rule);
        border-bottom-width: 2px; border-radius: 5px; padding: 2.5px 6px; color: var(--muted);
        font-family: inherit; min-width: 17px; text-align: center; display: inline-block; }

  #toast { position: fixed; left: 50%; bottom: 54px; transform: translateX(-50%) translateY(8px);
    background: var(--accent); color: var(--accent-ink);
    font-size: 12px; font-weight: 700; padding: 9px 18px; border-radius: 99px;
    opacity: 0; transition: opacity .16s, transform .16s; pointer-events: none; }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="bar">
    <div class="logo">AF</div>
    <input id="q" type="text" placeholder="Search files, downloads — or ask anything"
           autocomplete="off" spellcheck="false" />
    <span class="count" id="count"></span>
  </div>

  <div class="chips" id="chips"></div>

  <div class="body">
    <div id="list"></div>
    <aside class="prev empty" id="prev"></aside>
  </div>

  <div class="foot">
    <span class="act"><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span class="act"><kbd>↵</kbd> <span id="hintEnter">open</span></span>
    <span class="act"><kbd>Ctrl</kbd><kbd>↵</kbd> folder</span>
    <span class="act"><kbd>Ctrl</kbd><kbd>C</kbd> copy</span>
    <span class="act sp"><kbd>Tab</kbd> filter</span>
    <span class="act"><kbd>Esc</kbd> close</span>
  </div>

  <div id="toast"></div>

<script>
const api = window.spotlight;
const $q = document.getElementById("q");
const $list = document.getElementById("list");
const $count = document.getElementById("count");
const $chips = document.getElementById("chips");
const $prev = document.getElementById("prev");
const $toast = document.getElementById("toast");

const FILTERS = [
  ["all", "All"], ["image", "Images"], ["pdf", "PDFs"], ["doc", "Docs"],
  ["sheet", "Sheets"], ["media", "Media"], ["code", "Code"], ["folder", "Folders"],
];

let rows = [];
let sel = 0;
let group = "all";
let seq = 0;
let lastCounts = {};
let contentMode = "off";
let consentDismissed = false;
let pendingPlan = null;

// Reopening the popup used to wipe the query and the answer, so glancing at
// another window mid-search meant starting over. The session is kept instead:
// what you searched, what came back, and what the agent said are all still
// there when it comes back. Ctrl+Space is a place you return to, not a form.
const session = { query: "", group: "all", answerHtml: "", results: null };

const KIND_ICON = {
  image: "🖼", pdf: "📕", doc: "📄", sheet: "📊", slide: "📽", video: "🎬",
  audio: "🎵", code: "⌨", data: "🔧", archive: "🗜", app: "⚙", folder: "📁", other: "📄",
};

const fmtSize = (b) => {
  if (!b) return "";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (b < 10 && i > 0 ? b.toFixed(1) : Math.round(b)) + " " + u[i];
};
const fmtWhen = (ms) => {
  if (!ms) return "";
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  const d = Math.round(s / 86400);
  return d < 30 ? d + "d ago" : new Date(ms).toLocaleDateString();
};
const esc = (s) => String(s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let toastTimer = 0;
function toast(msg) {
  $toast.textContent = msg;
  $toast.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove("on"), 1500);
}

function highlight(text, query) {
  const terms = query.toLowerCase().split(/\s+/).filter((t) => t.length > 2);
  let out = esc(text);
  for (const t of terms) {
    const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    out = out.replace(re, "<mark>$1</mark>");
  }
  return out;
}

function renderChips() {
  $chips.innerHTML = "";
  FILTERS.forEach(([key, label]) => {
    const n = lastCounts[key];
    const b = document.createElement("button");
    b.className = "chip" + (group === key ? " on" : "") + (n === 0 ? " zero" : "");
    b.innerHTML = esc(label) + (n ? '<span class="n">' + n + "</span>" : "");
    b.addEventListener("click", () => { group = key; run(); });
    $chips.appendChild(b);
  });
}

const sect = (t) => {
  const el = document.createElement("div");
  el.className = "sect";
  el.textContent = t;
  return el;
};

// Is this a question, or a filename?
//
// It decides what Enter does, which is the difference between "answer me" and
// "open something". Typing "where is my internship ppt" and pressing Enter used
// to open whichever file happened to be selected — the Ask row was last in the
// list and a file was selected by default, so the one thing the sentence asked
// for was the one thing Enter would not do.
//
// A question mark, a question word, or simply enough words to be a sentence:
// nobody names a file "where is my internship ppt", and nobody types four words
// of prose when they want a filename match.
const ACTION_HINT =
  /\b(?:create|make)\b[\s\S]*\bfolder\b|\b(?:copy|collect|gather|group|organi[sz]e)\b/i;

const ASK_WORDS =
  /^(where|what|who|whose|which|when|why|how|is|are|was|were|can|could|should|would|do|does|did|find|show|list|tell|give|summari[sz]e|explain|compare|draft|write|remind|open the|search)\b/i;

function looksLikeQuestion(q) {
  const t = (q || "").trim();
  if (t.length < 3) return false;
  if (t.endsWith("?")) return true;
  if (ASK_WORDS.test(t)) return true;
  return t.split(/\s+/).length >= 4;
}

function render(res, query) {
  const items = res.items || [];
  const inside = res.inside || [];
  contentMode = res.contentMode || contentMode;
  session.results = res;
  session.query = query;
  session.group = group;

  const q = query.trim();
  const asking = looksLikeQuestion(q);

  rows = [];
  // A question puts Ask first and selects it, so Enter answers. A keyword puts
  // the files first, so Enter opens. Either way the highlighted row is what
  // Enter will do — the user never has to guess.
  if (q && asking) rows.push({ kind: "ask", q });
  inside.forEach((hit) => rows.push({ kind: "inside", hit }));
  items.forEach((item) => rows.push({ kind: "file", item }));
  if (q && !asking) rows.push({ kind: "ask", q });

  sel = 0;
  $count.textContent = items.length || "";
  $list.innerHTML = "";
  // Retrigger the enter animation: removing and re-adding in the same frame
  // would be coalesced away, so force a reflow between.
  $list.classList.remove("enter");
  void $list.offsetWidth;
  $list.classList.add("enter");
  renderChips();

  // A pending action sits above everything — it's waiting on a decision.
  if (pendingPlan) $list.appendChild(planCard(pendingPlan));

  // A previous answer survives a re-render, so refining the search doesn't
  // throw away what the agent already told you.
  if (session.answerHtml) {
    const a = document.createElement("div");
    a.className = "answer";
    a.innerHTML = session.answerHtml;
    $list.appendChild(a);
  }

  if (contentMode === "off" && q.length > 2 && !consentDismissed) {
    $list.appendChild(consentCard());
  }

  if (!rows.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = "<b>Nothing here matches that.</b>" +
      '<span class="hint">Try another filter, or press <kbd>↵</kbd> to ask instead.</span>';
    $list.appendChild(e);
    updatePreview();
    return;
  }

  let last = null;
  rows.forEach((r, i) => {
    if (r.kind !== last) {
      last = r.kind;
      if (r.kind === "inside") $list.appendChild(sect("Found inside your files"));
      else if (r.kind === "file") $list.appendChild(sect(q ? "Files" : "Recent files & downloads"));
    }
    const el = document.createElement("div");
    el.className = "row" + (r.kind === "ask" ? " ask" : r.kind === "inside" ? " inside" : "");
    el.dataset.i = i;

    if (r.kind === "ask") {
      // An instruction and a question are different jobs, and the row has to
      // say which one Enter will do — "Answer:" on "copy my resumes somewhere"
      // promises the wrong thing entirely.
      const primary = i === 0;
      const isDo = ACTION_HINT.test(r.q);
      const label = isDo ? "Do this: “" : primary ? "Answer: “" : "Ask about “";
      const sub = isDo
        ? "Press Enter — you'll see exactly what it will do first"
        : primary
          ? "Press Enter — answered here from your own files"
          : "Answered here, without leaving this window";
      el.innerHTML =
        '<div class="ico">' + (isDo ? "⚡" : "✦") + '</div><div class="txt"><div class="nm">' +
        label + esc(r.q) + '”</div><div class="pt">' + sub + "</div></div>";
    } else if (r.kind === "inside") {
      const f = r.hit.file;
      el.innerHTML = '<div class="ico">' + (KIND_ICON[f.kind] || "📄") + "</div>" +
        '<div class="txt"><div class="nm">' + esc(f.name) + "</div>" +
        '<div class="snip">' + highlight(r.hit.snippet, query) + "</div></div>";
    } else {
      const it = r.item;
      el.innerHTML = '<div class="ico">' + (KIND_ICON[it.kind] || "📄") + "</div>" +
        '<div class="txt"><div class="nm">' + esc(it.name) + "</div>" +
        '<div class="pt">' + esc(it.dir) + "</div></div>" +
        '<div class="meta">' + fmtWhen(it.mtime) + (it.isDir ? "" : "<br>" + fmtSize(it.size)) + "</div>";
    }
    el.addEventListener("mousemove", () => setSel(i));
    el.addEventListener("click", () => activate(i));
    $list.appendChild(el);
  });
  paint();
}

function paint() {
  [...$list.querySelectorAll(".row")].forEach((el) => {
    const on = +el.dataset.i === sel;
    el.classList.toggle("on", on);
    if (on) el.scrollIntoView({ block: "nearest" });
  });
  // The hint tracks the selection, so Enter's effect is never a guess.
  const hint = document.getElementById("hintEnter");
  if (hint) {
    const r = rows[sel];
    hint.textContent = r && r.kind === "ask" ? "ask" : "open";
  }
  updatePreview();
}

function setSel(i) {
  if (i === sel || i < 0 || i >= rows.length) return;
  sel = i;
  paint();
}

const fileOf = (r) => (!r ? null : r.kind === "file" ? r.item : r.kind === "inside" ? r.hit.file : null);
const current = () => rows[sel];

// The preview is requested per selection, and a slow read for a row you've
// already moved off must never paint over the row you're on now.
let prevSeq = 0;
async function updatePreview() {
  const f = fileOf(current());
  if (!f) { $prev.classList.add("empty"); $prev.innerHTML = ""; return; }
  const mine = ++prevSeq;
  $prev.classList.remove("empty");
  $prev.innerHTML =
    '<div class="pname">' + esc(f.name) + "</div>" +
    '<div class="pmeta">' + (f.isDir ? "Folder" : fmtSize(f.size)) + " · " + fmtWhen(f.mtime) + "</div>" +
    '<div class="body-text">Loading preview…</div>' + actionsHtml();
  bindActions(f);

  const p = await api.preview(f.path);
  if (mine !== prevSeq) return;

  let bodyHtml = '<div class="body-text">No preview for this type.</div>';
  if (p && p.type === "image") bodyHtml = '<div class="shot"><img src="' + p.dataUri + '" alt="" /></div>';
  else if (p && p.type === "text") bodyHtml = '<div class="body-text">' + esc(p.text) + "</div>";
  else if (p && p.type === "folder") {
    bodyHtml = '<div class="body-text">' + p.count + " item" + (p.count === 1 ? "" : "s") +
      (p.items.length ? "<br>" + p.items.map(esc).join("<br>") : "") + "</div>";
  }

  $prev.innerHTML =
    '<div class="pname">' + esc(f.name) + "</div>" +
    '<div class="pmeta">' + (f.isDir ? "Folder" : fmtSize(f.size)) + " · " + fmtWhen(f.mtime) + "</div>" +
    bodyHtml + actionsHtml();
  bindActions(f);
}

const actionsHtml = () =>
  '<div class="acts">' +
  '<button class="wide" data-a="open">Open</button>' +
  '<button data-a="copy">Copy file</button>' +
  '<button data-a="reveal">Folder</button>' +
  '<button data-a="path">Copy path</button>' +
  '<button data-a="share">Share</button>' +
  "</div>";

function bindActions(f) {
  $prev.querySelectorAll(".acts button").forEach((b) => {
    b.addEventListener("click", async (e) => {
      e.stopPropagation();
      const a = b.dataset.a;
      if (a === "open") return api.open(f.path);
      if (a === "reveal") return api.reveal(f.path);
      if (a === "copy") { toast((await api.copy(f.path, "file")) === "file" ? "File copied" : "Path copied"); return; }
      if (a === "path") { await api.copy(f.path, "path"); toast("Path copied"); return; }
      if (a === "share") { const how = await api.share(f.path); toast(how === "sheet" ? "Sharing…" : "Path copied to share"); }
    });
  });
}

async function activate(i) {
  const r = rows[i ?? sel];
  if (!r) return;
  if (r.kind === "ask") {
    // An instruction ("copy my resumes to the desktop") is planned, not asked.
    const p = await api.plan(r.q);
    if (p && p.ok) { pendingPlan = p; return run(); }
    if (p && p.reason) {
      session.answerHtml = "<h4>AgentFury</h4><p>" + esc(p.reason) + "</p>";
      return run();
    }
    return askInline(r.q);
  }
  const f = fileOf(r);
  if (f) api.open(f.path);
}

// One question in flight at a time. Without this, hitting Enter twice fires two
// requests and whichever returns last wins — which is how the same question
// ends up answered twice with different text.
let asking = false;
async function askInline(q) {
  if (asking) return;
  asking = true;
  session.answerHtml = '<h4>AgentFury</h4><p class="dots"><span></span><span></span><span></span></p>';
  render(session.results || {}, session.query);
  try {
    const res = await api.ask(q);
    if (res && res.ok) {
      const src = (res.sources || []).length
        ? '<div class="src"><span>From</span>' +
          res.sources.map((s) => '<span class="srcpill">' + esc(s.name) + "</span>").join("") + "</div>"
        : "";
      session.answerHtml = "<h4>AgentFury</h4><p>" + esc(res.text) + "</p>" + src;
    } else {
      session.answerHtml = "<h4>AgentFury</h4><p>" +
        esc((res && res.error) || "Couldn't answer that right now.") + "</p>";
    }
  } finally {
    asking = false;
    render(session.results || {}, session.query);
  }
}

// The confirmation card. It exists so a parsed sentence never becomes a disk
// write on its own — you see the folder, the destination and the exact file
// count before anything happens.
function planCard(p) {
  const el = document.createElement("div");
  el.className = "plan";
  const shown = p.files.slice(0, 4).map((f) => esc(f.name)).join("<br>");
  const more = p.files.length > 4 ? `<br>+ ${p.files.length - 4} more` : "";
  el.innerHTML =
    "<h4>Ready to run</h4>" +
    '<div class="title">Copy ' + p.files.length + " file" + (p.files.length === 1 ? "" : "s") +
    " into “" + esc(p.folderName) + "”</div>" +
    '<div class="where">' + esc(p.destPath) + "</div>" +
    '<div class="files">' + shown + more + "</div>" +
    '<div class="btns"><button class="go" id="pgo">Create folder &amp; copy</button>' +
    '<button class="no" id="pno">Cancel</button>' +
    '<span class="safe">Copies — originals stay put</span></div>';

  el.querySelector("#pno").addEventListener("click", () => { pendingPlan = null; run(); });
  el.querySelector("#pgo").addEventListener("click", async () => {
    const go = el.querySelector("#pgo");
    go.textContent = "Copying…";
    go.disabled = true;
    const res = await api.execute(p);
    pendingPlan = null;
    session.answerHtml = res.ok
      ? "<h4>Done</h4><p>Copied " + res.copied + " file" + (res.copied === 1 ? "" : "s") +
        " into " + esc(res.folder) +
        (res.failedCount ? "<br>" + res.failedCount + " couldn't be copied." : "") + "</p>"
      : "<h4>AgentFury</h4><p>" + esc(res.error || "That didn't work.") + "</p>";
    run();
  });
  return el;
}

function consentCard() {
  const el = document.createElement("div");
  el.className = "consent";
  el.innerHTML =
    "<h4>Search what's written inside your files?</h4>" +
    "<p>Quick Find matches file names right now. It can also read the text inside " +
    "your documents, so you can search for what you actually wrote — and ask about it.<br><br>" +
    "The index is built and kept <b>on this laptop</b>. Nothing is uploaded. When you ask a " +
    "question, only the few matching passages are sent to answer it.</p>" +
    '<div class="btns"><button class="cprimary" id="cyes">Keep it on this laptop</button>' +
    '<button class="cghost" id="cno">Not now</button></div>';
  el.querySelector("#cyes").addEventListener("click", async () => {
    await api.settings({ contentMode: "local" });
    contentMode = "local";
    consentDismissed = true;
    run();
  });
  el.querySelector("#cno").addEventListener("click", () => { consentDismissed = true; run(); });
  return el;
}

// One search in flight at a time, and the newest always wins. The debounce
// collapses a keystroke burst; the sequence guard drops a slow reply that
// arrives after a newer one has already painted.
let timer = 0;
$q.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(run, 45);
});

async function run() {
  const query = $q.value;
  const mine = ++seq;
  const res = await api.search(query, group);
  if (mine !== seq) return;
  lastCounts = (res && res.counts) || {};
  render(res || {}, query);
}

function cycleFilter(dir) {
  const i = FILTERS.findIndex(([k]) => k === group);
  group = FILTERS[(i + dir + FILTERS.length) % FILTERS.length][0];
  run();
}

document.addEventListener("keydown", async (e) => {
  const f = fileOf(current());
  if (e.key === "Escape") { e.preventDefault(); api.hide(); return; }
  if (e.key === "Tab") { e.preventDefault(); cycleFilter(e.shiftKey ? -1 : 1); return; }
  if (e.key === "ArrowDown") { e.preventDefault(); setSel(Math.min(sel + 1, rows.length - 1)); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); setSel(Math.max(sel - 1, 0)); return; }
  if (e.key === "Enter") {
    e.preventDefault();
    if (f && (e.ctrlKey || e.metaKey)) api.reveal(f.path);
    else activate();
    return;
  }
  if (!f) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "c") {
    e.preventDefault();
    const how = await api.copy(f.path, e.shiftKey ? "path" : "file");
    toast(how === "file" ? "File copied" : "Path copied");
    return;
  }
  if ((e.ctrlKey || e.metaKey) && k === "s") {
    e.preventDefault();
    const how = await api.share(f.path);
    toast(how === "sheet" ? "Sharing…" : "Path copied to share");
    return;
  }
  if (e.key === "Delete") {
    e.preventDefault();
    if (await api.trash(f.path)) { toast("Moved to recycle bin"); run(); }
    else toast("Couldn't move that file");
  }
});

// Reopening restores the session rather than clearing it. The text is selected
// so typing still replaces it instantly — you can carry on or start over, and
// neither costs a click.
api.onShow(() => {
  $q.value = session.query || "";
  group = session.group || "all";
  $q.focus();
  $q.select();
  run();
});

run();
$q.focus();
</script>
</body>
</html>
