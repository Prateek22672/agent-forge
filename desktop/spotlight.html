<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>AgentFury Quick Find</title>
<style>
  :root {
    --bg: rgba(22, 23, 28, .98);
    --fg: #f2f3f7;
    --muted: #8b90a0;
    --dim: #5c6172;
    --sel-bg: rgba(91, 108, 240, .22);
    --accent: #8b9bff;
    --rule: rgba(255, 255, 255, .07);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body {
    font-family: "Segoe UI", -apple-system, system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 13px;
    overflow: hidden;
  }

  /* search bar */
  .bar { display: flex; align-items: center; gap: 12px; padding: 0 17px; height: 58px; flex: none; border-bottom: 1px solid var(--rule); }
  .logo { width: 21px; height: 21px; border-radius: 6px; background: #fff; color: #000; display: grid; place-items: center; font-size: 10px; font-weight: 800; letter-spacing: -.04em; flex: none; }
  #q {
    flex: 1; background: none; border: 0; outline: none; color: var(--fg);
    font-size: 17px; font-family: inherit; padding: 0;
  }
  #q::placeholder { color: var(--dim); }
  .badge { font-size: 10.5px; color: var(--dim); border: 1px solid var(--rule); padding: 3px 7px; border-radius: 5px; flex: none; }

  /* results */
  #list { flex: 1; overflow-y: auto; padding: 6px; }
  #list::-webkit-scrollbar { width: 9px; }
  #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 5px; border: 3px solid transparent; background-clip: content-box; }

  .sect { font-size: 10px; text-transform: uppercase; letter-spacing: .11em; color: var(--dim); padding: 9px 12px 5px; }

  .row {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px;
    border-radius: 8px; cursor: default; scroll-margin: 8px;
  }
  .row.on { background: var(--sel-bg); }
  .ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-size: 14px; flex: none; background: rgba(255,255,255,.06); }
  .txt { min-width: 0; flex: 1; }
  .nm { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pt { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; margin-top: 1px; }
  .meta { font-size: 11px; color: var(--dim); flex: none; text-align: right; }

  .empty { padding: 34px 20px; text-align: center; color: var(--muted); font-size: 13.5px; }
  .empty b { color: var(--fg); font-weight: 600; }

  /* ask row */
  .ask .ico { background: rgba(139,155,255,.16); }
  .ask .nm { color: var(--accent); }

  /* footer */
  .foot {
    flex: none; display: flex; align-items: center; gap: 15px; padding: 8px 15px;
    border-top: 1px solid var(--rule); font-size: 11px; color: var(--dim);
  }
  .foot .sp { margin-left: auto; }
  kbd {
    font-family: inherit; font-size: 10px; background: rgba(255,255,255,.08);
    border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px;
    padding: 1.5px 5px; color: var(--muted);
  }
</style>
</head>
<body>
  <div class="bar">
    <div class="logo">AF</div>
    <input id="q" type="text" placeholder="Search files, downloads — or ask anything" autocomplete="off" spellcheck="false" />
    <span class="badge" id="count"></span>
  </div>

  <div id="list"></div>

  <div class="foot">
    <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span><kbd>↵</kbd> open</span>
    <span><kbd>Ctrl</kbd>+<kbd>↵</kbd> show in folder</span>
    <span class="sp"><kbd>Esc</kbd> close</span>
  </div>

<script>
const api = window.spotlight;
const $q = document.getElementById("q");
const $list = document.getElementById("list");
const $count = document.getElementById("count");

let rows = [];      // [{kind:'file'|'ask', item?}]
let sel = 0;
let seq = 0;        // guards against a slow search overwriting a newer one

const ICONS = [
  [/\.(png|jpe?g|gif|webp|bmp|svg|heic|avif)$/i, "🖼"],
  [/\.(mp4|mkv|mov|avi|webm|m4v)$/i, "🎬"],
  [/\.(mp3|wav|flac|m4a|aac|ogg)$/i, "🎵"],
  [/\.pdf$/i, "📕"],
  [/\.(docx?|odt|rtf)$/i, "📄"],
  [/\.(xlsx?|csv|ods)$/i, "📊"],
  [/\.(pptx?|odp)$/i, "📽"],
  [/\.(zip|rar|7z|tar|gz|xz)$/i, "🗜"],
  [/\.(exe|msi|dmg|appimage|deb|apk)$/i, "⚙"],
  [/\.(js|ts|jsx|tsx|py|java|go|rs|rb|php|c|cpp|h|cs|sh|ps1)$/i, "⌨"],
  [/\.(json|ya?ml|toml|ini|env|xml)$/i, "🔧"],
  [/\.(txt|md|log)$/i, "📝"],
];
const iconFor = (it) => {
  if (it.isDir) return "📁";
  for (const [re, ic] of ICONS) if (re.test(it.name)) return ic;
  return "📄";
};

const fmtSize = (b) => {
  if (!b) return "";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (b < 10 && i > 0 ? b.toFixed(1) : Math.round(b)) + " " + u[i];
};

const fmtWhen = (ms) => {
  if (!ms) return "";
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  const d = Math.round(s / 86400);
  if (d < 30) return d + "d ago";
  return new Date(ms).toLocaleDateString();
};

function render(items, query) {
  rows = items.map((item) => ({ kind: "file", item }));
  const q = query.trim();
  if (q) rows.push({ kind: "ask", q });

  sel = 0;
  $count.textContent = items.length ? items.length + (items.length === 1 ? " result" : " results") : "";
  $list.innerHTML = "";

  if (!rows.length) {
    $list.innerHTML = '<div class="empty">Nothing on this laptop matches that.<br><b>Start typing to search your files.</b></div>';
    return;
  }

  const head = document.createElement("div");
  head.className = "sect";
  head.textContent = q ? "Files on this laptop" : "Recent files & downloads";
  $list.appendChild(head);

  rows.forEach((r, i) => {
    const el = document.createElement("div");
    el.className = "row" + (r.kind === "ask" ? " ask" : "");
    el.dataset.i = i;
    if (r.kind === "ask") {
      el.innerHTML =
        '<div class="ico">✦</div><div class="txt"><div class="nm">Ask AgentFury about “' +
        esc(r.q) + '”</div><div class="pt">Opens the assistant with this question</div></div>';
    } else {
      const it = r.item;
      el.innerHTML =
        '<div class="ico">' + iconFor(it) + '</div>' +
        '<div class="txt"><div class="nm">' + esc(it.name) + '</div>' +
        '<div class="pt">' + esc(it.dir) + '</div></div>' +
        '<div class="meta">' + fmtWhen(it.mtime) + (it.isDir ? "" : "<br>" + fmtSize(it.size)) + '</div>';
    }
    el.addEventListener("mousemove", () => setSel(i));
    el.addEventListener("click", () => activate(i, false));
    $list.appendChild(el);
  });
  paint();
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function paint() {
  [...$list.querySelectorAll(".row")].forEach((el) => {
    const on = +el.dataset.i === sel;
    el.classList.toggle("on", on);
    if (on) el.scrollIntoView({ block: "nearest" });
  });
}

function setSel(i) {
  if (i === sel || i < 0 || i >= rows.length) return;
  sel = i;
  paint();
}

function activate(i, reveal) {
  const r = rows[i];
  if (!r) return;
  if (r.kind === "ask") api.ask(r.q);
  else if (reveal) api.reveal(r.item.path);
  else api.open(r.item.path);
}

let timer = 0;
$q.addEventListener("input", () => {
  clearTimeout(timer);
  // Short debounce: long enough to skip a keystroke burst, short enough that it
  // still feels like it answers as you type.
  timer = setTimeout(run, 45);
});

async function run() {
  const query = $q.value;
  const mine = ++seq;
  const items = await api.search(query);
  if (mine !== seq) return; // a newer keystroke already won
  render(items, query);
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); api.hide(); return; }
  if (e.key === "ArrowDown") { e.preventDefault(); setSel(Math.min(sel + 1, rows.length - 1)); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); setSel(Math.max(sel - 1, 0)); return; }
  if (e.key === "Enter") { e.preventDefault(); activate(sel, e.ctrlKey || e.metaKey); return; }
});

// The main process re-shows this window rather than recreating it, so reset the
// query each time it appears — a spotlight should always open ready to type.
api.onShow(() => {
  $q.value = "";
  $q.focus();
  $q.select();
  run();
});

run();
$q.focus();
</script>
</body>
</html>
