# Build the desktop installers and publish them to a GitHub Release.
#
# Trigger: push a version tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
#
# WHY THE RELEASE IS CREATED IN ITS OWN JOB FIRST
#   electron-builder's GitHub publisher creates the release itself if it cannot
#   find one for the tag. Two builders doing that at once each made their own,
#   leaving two releases sharing a tag — and since every tag URL resolves to
#   whichever was created first, the Windows installer sat in an unreachable
#   duplicate and 404'd. Running the jobs in sequence helped but did not fix it:
#   v0.6.2 still ended up with a stray second release holding one blockmap, and
#   v0.7.0 published its .exe and then failed before uploading latest.yml — the
#   file electron-updater needs to detect an update at all.
#
#   Creating the release up front removes the race entirely. Neither builder has
#   to decide whether to create one, so both simply upload, and the two platform
#   jobs can run in parallel again.
name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed so the GITHUB_TOKEN can create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — reusing it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "${GITHUB_REF_NAME#v}" \
              --notes "AgentFury ${GITHUB_REF_NAME#v}" \
              --verify-tag
          fi

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install desktop deps
        working-directory: desktop
        run: npm install
      - name: Set version to match the tag
        working-directory: desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build + publish Windows installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

  mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install desktop deps
        working-directory: desktop
        run: npm install
      - name: Set version to match the tag
        working-directory: desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build + publish macOS dmg (unsigned)
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no Apple Developer cert) — produces an unsigned dmg.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run publish
